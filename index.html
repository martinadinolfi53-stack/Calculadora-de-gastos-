<!doctype html>
<html lang="es-UY">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#eef2fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b0e16" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gastos" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <title>Calculadora de gastos</title>
    <script>
      // Aplica el tema guardado antes de pintar, para evitar un parpadeo.
      try {
        var t = localStorage.getItem('tema');
        if (t === 'claro') document.documentElement.dataset.theme = 'light';
        if (t === 'oscuro') document.documentElement.dataset.theme = 'dark';
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
